[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dertwin"
version = "0.2.1"
description = "Digital twin simulator for distributed energy resources — BESS, PV inverters, energy meters"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oleksandr Spivak", email = "oleksdertwin@gmail.com" }]
requires-python = ">=3.11"
keywords = ["modbus", "digital-twin", "bess", "energy", "ems", "der", "simulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pymodbus>=3.8,<3.13",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AlexSpivak/dertwin"
Repository = "https://github.com/AlexSpivak/dertwin"
"Bug Tracker" = "https://github.com/AlexSpivak/dertwin/issues"

[project.scripts]
dertwin = "dertwin.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
# The built-in clear-sky model is standard library only. This extra swaps in
# pvlib for anyone who wants reference-grade irradiance, and lets the test
# suite check the built-in model against it.
pvlib = [
    "pvlib>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "examples*"]